name: Apex Ops API CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-test-scan:
    name: Lint, Test, Build and Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint
        run: |
          ruff check app tests

      - name: Run tests
        run: |
          pytest -v

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=${GITHUB_SHA::7} \
            -t ghcr.io/mahendra0456/apex-ops-api:${GITHUB_SHA} .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/mahendra0456/apex-ops-api:${{ github.sha }}
          scan-type: image
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ghcr.io/mahendra0456/apex-ops-api:${GITHUB_SHA} \
            ghcr.io/mahendra0456/apex-ops-api:latest

          docker push ghcr.io/mahendra0456/apex-ops-api:${GITHUB_SHA}
          docker push ghcr.io/mahendra0456/apex-ops-api:latest
